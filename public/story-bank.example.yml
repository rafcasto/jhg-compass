personalization:
  adaptiveFraming:
    - role: "Delivery reliability under growth"
      emphasize: "Cadence and incident numbers first; the person who made releases boring while the team doubled"
      proof: "cv.md — Fortnightly release train, Incident halving, Cadence playbook reuse"
    - role: "Engineering operations that scale"
      emphasize: "Cost and on-call outcomes; the tooling decisions and what they removed"
      proof: "cv.md — On-call redesign, CI spend cut, Dependency board"
    - role: "Customer promises kept"
      emphasize: "Dated commitments met; lead with the migration programme and the enterprise dates kept"
      proof: "cv.md — Tenant migration programme, Enterprise dates kept"
  crossCuttingAdvantage: "I measure delivery in numbers the business already tracks, cadence, incidents and dates kept, so engineering and leadership argue about the same facts. I remove process before I add it. I have done this at 40 and at 110 engineers."
  portfolio:
    url: "https://ana-ferreira.example/release-cadence-playbook"
    description: "The release-cadence playbook: monthly to fortnightly across 9 teams in 2 quarters"
    whenToShare: "Delivery Lead, Engineering Operations Manager; after a first conversation that names release pain"
