stories:
  - id: "S1"
    title: "Fortnightly release train"
    situation: "a 110-engineer logistics SaaS doubling in size"
    task: "Own fortnightly release train"
    action: "a single release train with team-owned readiness checks"
    result: "Increased release frequency from monthly to fortnightly across 9 teams in 2 quarters through a single release train."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S2"
    title: "Incident halving"
    situation: "rising incident load during rapid hiring"
    task: "Own incident halving"
    action: "blameless reviews paired with service ownership"
    result: "Decreased production incidents from 14 to 7 a month in 12 months by pairing blameless reviews with service ownership."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S3"
    title: "On-call redesign"
    situation: "engineers leaving over on-call load"
    task: "Own on-call redesign"
    action: "an on-call rota built around service ownership"
    result: "Suppressed out-of-hours pages from 22 to 6 a month in 1 quarter by redesigning the on-call rota."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S4"
    title: "Tenant migration programme"
    situation: "a platform migration promised to enterprise customers"
    task: "Own tenant migration programme"
    action: "a dated migration plan agreed with every account owner"
    result: "Avoided renewal losses while migrating 240 enterprise tenants in 11 months, landing on the sold date."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S5"
    title: "Cadence playbook reuse"
    situation: "teams asking how FreightDesk released so often"
    task: "Own cadence playbook reuse"
    action: "a written playbook with templates"
    result: "Replicated the fortnightly release cadence at a second company and with 2 other Wellington SaaS teams."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S6"
    title: "Operational Excellence award"
    situation: "company-wide annual awards"
    task: "Own operational excellence award"
    action: "results tracked in the release and incident dashboards"
    result: "Received the 2023 Operational Excellence award for release and incident results across engineering."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S7"
    title: "Dependency board"
    situation: "work stalling between 5 teams"
    task: "Own dependency board"
    action: "one board every team updated before planning"
    result: "Created a cross-team dependency board that cut blocked work from about 30% to 12% in 6 months."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "estimate"
  - id: "S8"
    title: "Enterprise dates kept"
    situation: "enterprise contracts with dated deliverables"
    task: "Own enterprise dates kept"
    action: "a weekly commitments review with account owners"
    result: "Maintained 18 of 18 committed enterprise delivery dates over 24 months across 3 product lines."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
  - id: "S9"
    title: "CI spend cut"
    situation: "cloud costs flagged by the CFO"
    task: "Own ci spend cut"
    action: "tool consolidation and retiring unused jobs"
    result: "Cut CI spend by 31% in 1 quarter by consolidating 3 pipeline tools into one."
    reflection: "Measure the outcome the business already watches before changing anything."
    provenance: "verified"
snapshots:
  - company: "Kauri Logistics Cloud"
    storyId: "S1"
    title: "Fortnightly release train"
    context: "Logistics SaaS doubling its engineering team"
    challenge: "9 teams shipping on separate calendars"
    role: "Delivery Lead"
    activities:
      - "Mapped every team's release steps"
      - "Introduced one release train with readiness checks"
      - "Published the cadence and the numbers weekly"
    results:
      - "9 teams"
      - "2 quarters"
    relevance: "Kauri is doubling engineering after its Series B; the same cadence problem"
    keyDecisions:
      - "Kept team-owned readiness checks instead of a central release team"
  - company: "Harbourline Health Tech"
    storyId: "S4"
    title: "Tenant migration programme"
    context: "Platform migration promised to enterprise customers"
    challenge: "240 tenants with contractual dates"
    role: "Programme owner"
    activities:
      - "Agreed a dated plan with every account owner"
      - "Ran a weekly commitments review"
      - "Sequenced tenants by contract risk"
    results:
      - "240"
      - "11 months"
    relevance: "Harbourline's EHR roll-out has the same dated go-lives"
  - company: "Tōtara Payments"
    storyId: "S2"
    title: "Incident halving"
    context: "Payments-adjacent SaaS with rising incidents"
    challenge: "14 incidents a month during rapid hiring"
    role: "Delivery Lead"
    activities:
      - "Introduced blameless reviews"
      - "Paired reviews with service ownership"
      - "Tracked incidents per service monthly"
    results:
      - "14"
      - "7"
      - "12 months"
    relevance: "Tōtara freezes releases around peak trading because of incident risk"
