cv: |
  # CV -- Ana Ferreira

  **Headline:** Delivery Lead for SaaS teams scaling past product–market fit | Fortnightly releases at 110 engineers | Wellington
  **Email:** ana@anaferreira.nz
  **Phone:** +64 21 555 0199
  **Location:** Wellington, New Zealand
  **LinkedIn:** https://www.linkedin.com/in/ana-ferreira-delivery
  **Portfolio:** https://anaferreira.nz/release-cadence-playbook

  ## Professional Summary

  Delivery Lead with six years in B2B SaaS, taking engineering organisations from monthly to fortnightly releases while headcount doubled. Halved production incidents at one company and landed a 240-tenant migration on the sold date at another. Works from the numbers the business already tracks, cadence, incidents and dates kept, and removes process before adding it.

  ## Work Experience

  **FreightDesk Software** -- Wellington, New Zealand
  *Delivery Lead* -- March 2022 -- Present
  Led delivery for a logistics SaaS engineering organisation that grew from 55 to 110 engineers across nine teams and two time zones.
  - Moved release cadence from monthly to fortnightly across nine teams in two quarters by introducing a single release train with team-owned readiness checks (Fortnightly release train).
  - Halved production incidents from 14 to 7 per month over twelve months by pairing a blameless review cadence with an on-call rota redesigned around service ownership (Incident halving).
  - Landed the migration of 240 enterprise tenants to the new platform on the date sold to customers, 11 months, zero renewals lost in the quarter (Tenant migration programme).
  - Cut CI spend by 31% in one quarter by consolidating three pipeline tools into one and retiring 40% of unused jobs (CI spend cut).

  **Ledgerline** -- Auckland, New Zealand
  *Delivery Manager (promoted from Operations Analyst, 2020)* -- July 2019 -- February 2022
  Ran delivery for a 40-engineer accounting-integrations SaaS team selling to accounting firms in NZ and AU.
  - Built a cross-team dependency board that cut blocked work-in-progress from about 30% to 12% of tickets in six months (Dependency board).
  - Redesigned on-call so that pages outside business hours fell from 22 to 6 a month in one quarter, with no change to response-time commitments (On-call redesign).
  - Introduced the fortnightly release cadence later reused at FreightDesk, taking the team from monthly releases in two quarters.

  ## Projects

  - Release-cadence playbook: the method used at both companies, written up with templates and the numbers behind it; published at anaferreira.nz, reused by two other Wellington SaaS teams.
  - Tenant migration programme: 240 enterprise tenants, 11 months, date kept, zero renewals lost in the quarter.
  - Incident halving: 14 to 7 incidents a month in twelve months at 110 engineers, with the review format and rota design documented.

  ## Education

  **Bachelor of Commerce (Information Systems)** -- Victoria University of Wellington, 2017

  ## Certifications

  - ICAgile Certified Professional in Agile Coaching (ICP-ACC), 2021

  ## Skills

  Release management; incident management; on-call design; programme management; dependency mapping; CI/CD tooling (GitHub Actions, Buildkite); Jira and Linear administration; stakeholder reporting; blameless post-incident review facilitation
