personalization:
  targetRoles:
    - archetype: "Delivery Lead"
      axes: "release cadence, cross-team dependencies, incident reduction; Delivery reliability under growth"
      buys: "Predictable releases while headcount doubles, without adding process the engineers resent"
    - archetype: "Engineering Operations Manager"
      axes: "tooling, on-call, cost of delivery; Engineering operations that scale"
      buys: "One person who owns the how of shipping so the CTO can own the what"
    - archetype: "Technical Program Manager"
      axes: "multi-team programmes, customer commitments, migration programmes; Customer promises kept"
      buys: "Enterprise commitments landed on the date that was sold"
  adaptiveFraming:
    - role: "Delivery reliability under growth"
      emphasize: "Cadence and incident numbers first; I am the person who made releases boring while the team doubled"
      proof: "cv.md — Fortnightly release train, Incident halving, Dependency board"
    - role: "Engineering operations that scale"
      emphasize: "Cost and on-call outcomes; show the tooling decisions and what they removed"
      proof: "cv.md — On-call redesign, CI spend cut, Dependency board"
    - role: "Customer promises kept"
      emphasize: "Dated commitments met; lead with the migration programme and the enterprise renewals it protected"
      proof: "cv.md — Tenant migration programme, Fortnightly release train"
  exitNarrative: >
    I was the operations analyst who kept getting pulled into engineering stand-ups because the
    numbers I tracked were the ones nobody owned: how often we shipped, how often it broke, and
    which customer promise was about to slip. Over six years at two SaaS companies I turned that
    into a role, Delivery Lead, and ran it through a doubling of headcount and a tenant migration
    that touched every enterprise customer. I am now looking for a scale-up at the same inflection
    point, where releases have started to hurt and the founders know it, because that is the exact
    problem I have already solved twice.
  crossCuttingAdvantage: >
    I measure delivery in numbers the business already cares about, cadence, incidents and dates
    kept, so engineering and leadership argue about the same facts. I remove process before I add it,
    which is why engineers have asked to keep working with me after every reorganisation. I have done
    this at 40 and at 110 engineers, so I know which parts of the method change with size.
  portfolio:
    url: "https://anaferreira.nz/release-cadence-playbook"
    description: "The release-cadence playbook that took a 40-engineer SaaS team from monthly to fortnightly releases in two quarters"
    whenToShare: "After the first conversation with a hiring manager who has named release pain; never in a cold application"
  compTargets: "Target NZ$ 150,000–175,000; floor NZ$ 140,000. Y, up to 2 days on site in Wellington, no change to floor"
