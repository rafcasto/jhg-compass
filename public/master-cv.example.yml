cv: |-
  # CV -- Ana Ferreira

  **Headline:** Delivery Lead for SaaS teams scaling past product–market fit | Release management | Incident reduction | Customer commitments
  **Location:** Wellington, New Zealand
  **Email:** ana.ferreira@mail.example
  **Phone:** +64 21 555 0199
  **LinkedIn:** https://www.linkedin.com/in/example-ana-ferreira
  **Portfolio:** https://ana-ferreira.example/release-cadence-playbook

  ## Professional Summary

  Delivery Lead specialising in release management for B2B SaaS scale-ups, moving 9 teams from monthly to fortnightly releases in 2 quarters. Known for incident reduction from 14 to 7 a month, customer commitments kept at 18 of 18, and cross-team dependencies cleared from about 30% to 12% blocked work. Experienced in release cadence, on-call design and CI tooling, with a focus on predictable delivery while headcount doubles.

  ## Work Experience

  ### FreightDesk Software -- Wellington, New Zealand

  **Delivery Lead**
  March 2022 – Present

  Led delivery for a logistics SaaS engineering organisation that doubled in size across nine teams.

  - Moved release cadence from monthly to fortnightly across 9 teams in 2 quarters, by introducing a single release train with team-owned readiness checks
  - Halved production incidents from 14 to 7 a month in 12 months, by pairing blameless reviews with service ownership
  - Migrated 240 enterprise tenants in 11 months on the sold date, by agreeing a dated plan with every account owner
  - Kept 18 of 18 committed enterprise delivery dates over 24 months across 3 product lines, by running a weekly commitments review
  - Cut CI spend by 31% in 1 quarter, by consolidating 3 pipeline tools into one

  ### Ledgerline -- Auckland, New Zealand

  **Delivery Manager (promoted from Operations Analyst)**
  July 2019 – February 2022

  Ran delivery for an accounting-integrations SaaS team selling to accounting firms in New Zealand and Australia.

  - Reduced out-of-hours pages from 22 to 6 a month in 1 quarter, by redesigning the on-call rota around service ownership
  - Cut blocked work from about 30% to 12% of tickets in 6 months, by creating one cross-team dependency board every team updated before planning

  ## Projects

  - **Fortnightly release train** -- 9 teams on separate calendars → one release train, monthly to fortnightly in 2 quarters
  - **Tenant migration programme** -- platform migration promised to enterprise customers → 240 tenants in 11 months, on the sold date
  - **Incident halving** -- rising incidents during rapid hiring → 14 to 7 a month in 12 months
  - **Cadence playbook reuse** -- the release playbook adopted by 2 other Wellington SaaS teams

  ## Education

  - Bachelor of Commerce (Information Systems), Victoria University of Wellington (2017)

  ## Certifications

  - ICAgile Certified Professional in Agile Coaching, ICAgile, 2021

  ## Awards

  - Operational Excellence award, FreightDesk Software, 2023

  ## Skills

  - **Core expertise:** Release management; release cadence; incident reduction; on-call design; cross-team dependencies; customer commitments
  - **Adjacent credibility:** Programme delivery; stakeholder reporting; cost of delivery
  - **Industry keywords:** B2B SaaS; logistics software; enterprise migrations
  - **Tools and software:** Jira; Linear; GitHub Actions; Buildkite
  - **Languages:** English (native); te reo Māori (beginner)
