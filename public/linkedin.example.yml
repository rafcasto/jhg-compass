linkedin:
  headline: "Delivery Lead for SaaS scale-ups · Monthly to fortnightly releases across 9 teams · Incidents cut from 14 to 7 a month"
  about: |-
    I make releases boring at SaaS companies that are growing fast.

    At FreightDesk Software I moved nine teams from monthly to fortnightly releases in 2 quarters while engineering doubled, and production incidents fell from 14 to 7 a month in 12 months. Before that, at Ledgerline, I redesigned on-call so out-of-hours pages dropped from 22 to 6 a month in 1 quarter.

    What the work looks like: one release train that every team owns, blameless reviews tied to service ownership, and a weekly commitments review so enterprise dates hold. I measure delivery in the numbers the business already tracks, so engineering and leadership argue about the same facts.

    I'm looking for a Delivery Lead role at a SaaS scale-up where releases have started to hurt. If that's your team, message me here.
