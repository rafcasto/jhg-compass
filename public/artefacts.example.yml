notes: |-
  Hard no's (do not apply): on-site 5 days; hands-on coding roles; defence or gambling sectors
  Culture must-haves: engineers present in planning; incidents reviewed without blame; no unpaid take-home over 6 hours; deprioritise when absent: Y
  Soft dislikes (lower, not a no): pre-seed stage; agencies; companies under 30 staff
  Notice period: 28 days
  Never apply: Rapid Freight Systems; Kiwi Bet Online
  CV house rules: Single column, standard section headings, no tables, no photo, no graphics, nothing in header/footer; Contact details in the body only; standard fonts 10–12 pt when rendered; .docx or PDF only
  Top 3 right now: Kauri Logistics Cloud, Harbourline Health Tech, Tōtara Payments
