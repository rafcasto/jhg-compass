notes: |-
  Hard no's (do not apply): Commission-only roles; Roles carrying a personal sales quota; Gambling or tobacco sectors
  Culture must-haves: RevOps reports to the CRO or COO, not to one sales team; One CRM as the source of truth, or a mandate to get there; deprioritise when absent: Y
  Soft dislikes (lower, not a no): Pre-seed stage; Companies under 40 staff
  Notice period: 90 days
  Never apply: Rhône Retail Group
  CV house rules: Single column, standard headings, no photo, no tables or graphics; Contact details in the body only; PDF or .docx
  Top 3 right now: Fourvière Analytics, Gerland Health Software, Presqu'île Payments
