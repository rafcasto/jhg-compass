stories:
  - id: "S1"
    title: "Renewal forecast rebuilt"
    situation: "The renewal forecast for 120 enterprise accounts missed actuals by 18% and finance had stopped using it."
    task: "Build a forecast leadership would sign off without rework."
    action: "I rebuilt the forecast from CRM stage data, added a weekly risk review with account managers, and published accuracy against actuals every month."
    result: "Forecast error fell from 18% to 6% in 3 quarters; the CFO now uses it in the board pack."
    reflection: "Publishing the miss every month built more trust than any model change."
    provenance: "verified"
  - id: "S2"
    title: "Three CRMs into one"
    situation: "After two acquisitions, account data lived in 3 CRMs and nobody agreed on a customer count."
    task: "Move every enterprise account into one CRM without losing renewal history."
    action: "I mapped the fields, ran the cleanup with each team owner, and froze the old systems on a fixed date."
    result: "3 CRMs became one for 120 enterprise accounts in 5 months, signed off by the COO."
    reflection: "A fixed freeze date did more than any number of reminders."
    provenance: "verified"
  - id: "S3"
    title: "Handover in nineteen days"
    situation: "New enterprise customers waited weeks for a first working setup after signing."
    task: "Shorten the time from signature to first value."
    action: "I designed a handover form sales must complete before closing, and a kickoff checklist the success team runs in week one."
    result: "Time to first value fell from 41 days to 19 days."
    reflection: "I would involve sales leadership earlier; the form only stuck once they enforced it."
    provenance: "verified"
  - id: "S4"
    title: "Health score launch"
    situation: "Churn arrived as a surprise at renewal time."
    task: "Give account managers an early warning they would act on."
    action: "I built a health score from product usage, tickets and invoices, and reviewed the red accounts weekly with the team."
    result: "Enterprise churn fell from 9% to about 6% over 12 months, by my own calculation."
    reflection: "Fewer inputs made the score easier to trust."
    provenance: "estimate"
  - id: "S5"
    title: "At-risk renewals saved"
    situation: "A batch of enterprise renewals was flagged at risk late in the year."
    task: "Save as many as possible before their renewal dates."
    action: "I ran a renewal playbook: an executive call, a usage review, and a dated recovery plan for each account."
    result: "14 renewals were saved, worth EUR 1.2M ARR."
    reflection: "Starting the playbook 90 days out, not 30, is what I changed afterwards."
    provenance: "verified"
  - id: "S6"
    title: "Bug costs made visible"
    situation: "Support tickets showed the same product bugs again and again, but the cost never reached the product team."
    task: "Make the cost of those bugs visible."
    action: "I exported and tagged the tickets, tied them to the accounts at renewal, and presented the result to the CTO."
    result: "3 bugs were prioritised and fixed; ticket volume fell 22% in 2 quarters."
    reflection: "Putting a renewal next to each bug changed the conversation."
    provenance: "verified"
  - id: "S7"
    title: "First response under two hours"
    situation: "Customers waited most of a working day for a first reply."
    task: "Bring first response time down without adding staff."
    action: "I wrote reply templates for the top request types and set up routing by language and product."
    result: "First response time fell from 9 hours to 2 hours in 1 quarter."
    reflection: "The templates needed a monthly owner, or they went stale."
    provenance: "verified"
  - id: "S8"
    title: "Faster support onboarding"
    situation: "New support hires took two months to handle tickets alone."
    task: "Shorten the ramp without lowering quality."
    action: "I built a week-by-week training path with shadowing and graded practice tickets."
    result: "Ramp time fell from 8 weeks to about 5 weeks, by my count from the training tracker."
    reflection: "Graded practice tickets mattered more than the reading list."
    provenance: "estimate"
