cv: |-
  # CV -- Laurent Simon

  **Headline:** Revenue Operations Manager for B2B SaaS scale-ups | Renewal forecasting | CRM consolidation | Sales-to-success handover
  **Location:** Lyon, France
  **Email:** laurent.simon@mail.example
  **Phone:** +33 6 55 01 23 45
  **LinkedIn:** https://www.linkedin.com/in/laurent-simon-revops-example
  **Portfolio:** https://laurent-simon.example/renewal-forecast-one-pager
  **GitHub:** https://github.com/example-laurent-simon

  ## Professional Summary

  Customer Success Operations Manager moving into Revenue Operations, having cut renewal forecast error from 18% to 6% in 3 quarters for 120 enterprise accounts. Consolidated 3 CRMs into one and brought time to first value from 41 days to 19 days. Works from the front line up: processes built with the teams who run them.

  ## Work Experience

  ### Saône Commerce -- Lyon, France

  **Customer Success Operations Manager**
  April 2022 – Present

  Owned the CRM, the renewal forecast and the sales-to-success handover for an e-commerce platform's enterprise customers.

  - Cut renewal forecast error from 18% to 6% in 3 quarters, by rebuilding the forecast from CRM stage data and publishing accuracy against actuals monthly
  - Consolidated 3 CRMs into one for 120 enterprise accounts in 5 months, by running field mapping and cleanup with each team owner to a fixed freeze date
  - Reduced time to first value from 41 days to 19 days, by introducing a mandatory sales handover form and a week-one kickoff checklist
  - Saved 14 renewals worth EUR 1.2M ARR, by running a dated recovery playbook for every at-risk account
  - Lowered enterprise churn from 9% to about 6% over 12 months, by launching a health score reviewed weekly with account managers

  ### Saône Commerce -- Lyon, France

  **Customer Support Team Lead**
  September 2019 – March 2022

  Led the support team of the same platform, handling merchant tickets in French and English.

  - Got 3 renewal-blocking bugs fixed and cut ticket volume 22% in 2 quarters, by tying tagged tickets to renewals and presenting the cost to the CTO
  - Brought first response time from 9 hours to 2 hours in 1 quarter, by writing reply templates and routing by language and product
  - Shortened new-hire ramp from 8 weeks to about 5 weeks, by building a graded week-by-week training path

  ## Projects

  - **Renewal forecast rebuilt** -- finance had stopped using the forecast → error from 18% to 6% in 3 quarters
  - **Three CRMs into one** -- account data split after two acquisitions → one CRM for 120 enterprise accounts in 5 months
  - **Handover in nineteen days** -- slow starts for new enterprise customers → first value in 19 days instead of 41 days

  ## Education

  - Licence professionnelle, Commerce électronique, Université Lumière Lyon 2 (2019)

  ## Certifications

  - Salesforce Certified Administrator, Salesforce, 2023

  ## Skills

  - **Core expertise:** Renewal forecasting; CRM consolidation; sales-to-success handover; customer health scoring; pipeline hygiene
  - **Tools:** Salesforce; HubSpot; Gainsight; Looker; Google Sheets
  - **Languages:** French (native); English (C1, professional); German (A2)
