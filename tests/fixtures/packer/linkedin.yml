  about: |-
    I make revenue numbers that sales, success and finance all agree on.

    At Saône Commerce I rebuilt the renewal forecast for 120 enterprise accounts: error fell from 18% to 6% in 3 quarters, and finance put it back in the board pack. I consolidated 3 CRMs into one in 5 months, and a new handover between sales and success cut time to first value from 41 days to 19 days.

    How I work: start from the data the front line already touches, agree the rules with the teams who run them, and publish the numbers every month, misses included.

    I'm moving into Revenue Operations at a B2B SaaS scale-up. If your forecast starts arguments, message me here.
